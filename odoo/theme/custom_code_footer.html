<!-- Friction: WhatsApp enquiries and the Enquiry List (Tech Nova). Builds wa.me links and keeps the list in this browser only; sends nothing by itself.
     Since 26 Nov 2026 Odoo's own cart and checkout handle orders (click and collect); the Enquiry List is for styled looks and sold-out sizes. -->
<script>
(function () {
  'use strict';
  var WA = 'https://wa.me/12466221748';
  var KEY = 'friction_enquiry_bag';
  var ASK = 'Can you confirm the available items, sizes and price?';
  var ASK_ITEM = 'Is it still available?';
  function waLink(text) { return WA + '?text=' + encodeURIComponent(text); }
  // Store items (priced, from Loyverse) carry a SKU; styled looks don't
  function detail(name, size, sku) { var p = []; if (size) p.push('size ' + size); if (sku) p.push('SKU ' + sku); return name + (p.length ? ' (' + p.join(', ') + ')' : ''); }
  function money(v) { var n = Number(v); return n ? 'BBD $' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : ''; }
  function ready(fn) { if (document.readyState !== 'loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function localPath(u) { return /^\/[^/]/.test(String(u || '')) ? String(u) : '/shop'; }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function store(items) { try { localStorage.setItem(KEY, JSON.stringify(items)); return true; } catch (e) { return false; } }
  function updateCount() {
    var n = load().length;
    document.querySelectorAll('.fr-bag-count').forEach(function (b) { b.textContent = n; b.classList.toggle('d-none', !n); });
    // the header Enquiry List link only shows once something is in it
    document.querySelectorAll('.fr-enq-li').forEach(function (li) { li.classList.toggle('d-none', !n); });
  }
  // The size chosen in Odoo's size picker (store items with real sizes)
  function odooSize() {
    var root = document.querySelector('.js_add_cart_variants'); if (!root) return '';
    var s = root.querySelector('select.js_variant_change');
    if (s && s.selectedOptions && s.selectedOptions[0]) return (s.selectedOptions[0].getAttribute('data-value-name') || s.selectedOptions[0].textContent || '').trim();
    var i = root.querySelector('input.js_variant_change:checked'); if (!i) return '';
    var lab = i.id ? root.querySelector('label[for="' + i.id + '"]') : null;
    return (i.getAttribute('data-value-name') || (lab && lab.textContent) || '').trim();
  }

  function renderBag(host, emptyHtml) {
    var items = load();
    if (!items.length) { host.innerHTML = emptyHtml; return; }
    var anyLook = items.some(function (it) { return !money(it.price); });
    var lines = items.map(function (it, i) { return (i + 1) + '. ' + detail(it.name, it.size, it.sku) + (money(it.price) ? ' – ' + money(it.price) : ''); });
    var text = 'Hi Friction, I’m interested in these from your website:\n' + lines.join('\n') + '\n' + (anyLook ? ASK : 'Can you confirm they’re available?');
    host.innerHTML = '<ul class="fr-bag-list">' + items.map(function (it, i) {
      var url = esc(localPath(it.url)), img = esc(localPath(it.img)), price = money(it.price);
      return '<li class="fr-bag-item">'
        + '<a class="fr-bag-img" href="' + url + '"><img src="' + img + '" alt="' + esc(it.name) + '" loading="lazy"/></a>'
        + '<div class="fr-bag-info"><span class="fr-look-tag">' + (price ? 'Store item' : 'Styled Look') + '</span><a href="' + url + '">' + esc(it.name) + '</a>'
        + '<p>' + (price
          ? (it.size ? 'Size ' + esc(it.size) : 'Size not chosen') + (it.sku ? ' · SKU ' + esc(it.sku) : '') + ' · ' + esc(price)
          : (it.size ? 'Size ' + esc(it.size) + ' (availability to confirm)' : 'Size not chosen') + ' · Price on request') + '</p></div>'
        + '<button type="button" class="fr-bag-remove" data-i="' + i + '" aria-label="Remove ' + esc(it.name) + ' from your Enquiry List">Remove</button>'
        + '</li>';
    }).join('') + '</ul>'
      + '<div class="fr-bag-actions">'
      + '<a class="fr-btn fr-btn-red" target="_blank" rel="noopener" href="' + esc(waLink(text)) + '">Send my Enquiry List on WhatsApp</a>'
      + '<a class="fr-btn fr-btn-outline" href="/shop">Keep browsing</a>'
      + '<button type="button" class="fr-bag-clear">Clear list</button>'
      + '</div>'
      + '<p class="fr-bag-note">Your Enquiry List is saved in this browser only. Nothing is sent until you tap Send. To buy items that are in stock, use the cart.</p>';
    host.querySelectorAll('.fr-bag-remove').forEach(function (b) {
      b.addEventListener('click', function () {
        var list = load(); list.splice(parseInt(b.getAttribute('data-i'), 10), 1);
        store(list); updateCount(); renderBag(host, emptyHtml);
      });
    });
    var clear = host.querySelector('.fr-bag-clear');
    if (clear) clear.addEventListener('click', function () { store([]); updateCount(); renderBag(host, emptyHtml); });
  }

  ready(function () {
    if (document.body.classList.contains('editor_enable')) return;
    var path = location.pathname.replace(/\/+$/, '') || '/';

    updateCount();
    var isProduct = !!document.getElementById('product_detail');
    var isCheckout = /^\/shop\/(cart|checkout|address|payment|extra_info|confirm_order|confirmation)(\/|$)/.test(path);

    // Floating WhatsApp button, except on pages that already have their own WhatsApp buttons, and in the checkout
    if (!isProduct && !isCheckout && path !== '/enquiry-bag' && !document.querySelector('.fr-wa-float')) {
      var f = document.createElement('a');
      f.className = 'fr-wa-float';
      f.href = waLink('Hi Friction, I’m on your website and would like some help.');
      f.target = '_blank'; f.rel = 'noopener';
      f.setAttribute('aria-label', 'Chat with Friction on WhatsApp');
      document.body.appendChild(f);
      document.body.classList.add('fr-has-wa');
    }

    // Shop cards: open WhatsApp with the look name, or the item name and SKU
    document.querySelectorAll('.fr-card-cta').forEach(function (a) {
      var item = a.hasAttribute('data-item');
      a.href = waLink('Hi Friction, I’m interested in the ' + detail(a.getAttribute('data-look') || 'look', '', a.getAttribute('data-sku')) + ' from your website. ' + (item ? ASK_ITEM : ASK));
    });

    // Product page: the size (looks: our optional list; store items: Odoo's size picker) goes into every message
    if (isProduct) {
      var sel = document.querySelector('.fr-size-select');
      if (sel) sel.value = '';
      var size = function () { return sel && sel.value ? sel.value : odooSize(); };
      var refresh = function () {
        document.querySelectorAll('.fr-check').forEach(function (a) {
          var item = a.hasAttribute('data-item');
          a.href = waLink('Hi Friction, I’m interested in the ' + detail(a.getAttribute('data-look'), size(), a.getAttribute('data-sku')) + ' from your website. ' + (item ? ASK_ITEM : ASK));
        });
        document.querySelectorAll('.fr-wa-look').forEach(function (a) {
          a.href = waLink('Hi Friction, I have a question about the ' + detail(a.getAttribute('data-look'), size(), a.getAttribute('data-sku')) + ' from your website.');
        });
      };
      refresh();
      if (sel) sel.addEventListener('change', refresh);
      var picker = document.querySelector('.js_add_cart_variants');
      if (picker) picker.addEventListener('change', function () { setTimeout(refresh, 50); });
      // Odoo rewrites its contact button link after load, so set ours again then and on every press
      window.addEventListener('load', function () { setTimeout(refresh, 300); });
      document.querySelectorAll('.fr-check, .fr-wa-look').forEach(function (a) { a.addEventListener('pointerdown', refresh); a.addEventListener('click', refresh); });
      document.querySelectorAll('.fr-bag-add').forEach(function (b) {
        b.addEventListener('click', function () {
          var items = load(), s = size(), id = String(b.getAttribute('data-pid'));
          var exists = items.some(function (it) { return it.id === id && it.size === s; });
          if (!exists) items.push({ id: id, name: b.getAttribute('data-look'), url: b.getAttribute('data-url'), img: b.getAttribute('data-img'), size: s, sku: b.getAttribute('data-sku') || '', price: b.getAttribute('data-price') || '' });
          var msg = document.querySelector('.fr-bag-msg');
          if (!store(items)) { if (msg) msg.textContent = 'This browser could not save your list. Use the WhatsApp button instead.'; return; }
          updateCount();
          if (msg) msg.innerHTML = (exists ? 'Already in your Enquiry List. ' : 'Added to your Enquiry List' + (s ? ' (size ' + esc(s) + ')' : '') + '. ') + '<a href="/enquiry-bag">View list</a>';
        });
      });
    }

    var bag = document.getElementById('fr-bag');
    if (bag) renderBag(bag, bag.innerHTML);
  });
})();
</script>
